name: MTS Stock Checker

on:
  schedule:
    - cron: '0 14 * * *'  # Runs daily at 8 AM Mountain Time (14:00 UTC)
  workflow_dispatch:       # Also lets you run it manually anytime

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check stock and notify
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python check_stock.py
